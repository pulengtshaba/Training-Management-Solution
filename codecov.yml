coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 30%
        threshold: 2%
        informational: false

    patch:
      default:
        target: 30%
        threshold: 2%
        informational: false

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  require_base: false

github_checks:
  annotations: true
